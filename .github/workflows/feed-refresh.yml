name: Refresh Hamkor Feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run feed curator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEED_SIZE: '7'
          RSS_LANG: 'ru'
          RSS_REGION: 'UZ'
        run: |
          python scripts/feed_curator.py

      - name: Commit & push if changed
        run: |
          git config user.name "Hamkor Bot"
          git config user.email "bot@hamkor.top"
          git add docs/feed.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "daily feed refresh (auto)"
          git push
